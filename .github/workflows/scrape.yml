name: Scrape brocabrac.fr

on:
  schedule:
    # Tous les jours a 5h UTC (7h heure francaise)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit & push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json
          git diff --cached --quiet || git commit -m "data: update events $(date -u +%Y-%m-%d)"
          git push
